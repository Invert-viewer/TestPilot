spring:
  application:
    name: TestPilot
  # 本地数据库口令不写入仓库：从被 .gitignore 忽略的 local-application.yaml 读取（或设 DB_PASSWORD 环境变量）。
  config:
    import: optional:file:./local-application.yaml
  # 默认连接本机 MySQL 8（本地开发库 testpilot，账号口令可用环境变量覆盖）。
  # 无 MySQL 时用 --spring.profiles.active=h2 回退到 H2 文件库。
  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3306/testpilot?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}"
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
  sql:
    init:
      mode: always
      encoding: UTF-8
  mvc:
    problemdetails:
      enabled: false

mybatis:
  configuration:
    map-underscore-to-camel-case: true

testpilot:
  apifox:
    cli-path: ${APIFOX_CLI_PATH:apifox.cmd}
    shell: cmd.exe
    report-dir: ./data/reports
    timeout-seconds: ${APIFOX_TIMEOUT_SECONDS:900}
    assets: []
